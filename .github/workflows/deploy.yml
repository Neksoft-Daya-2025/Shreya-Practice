
name: Check GitHub SSH Key

on:
  workflow_dispatch:

jobs:
  check-key:
    runs-on: ubuntu-latest

    steps:
      - name: Check key fingerprint
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -y -f /tmp/vps_key | ssh-keygen -lf -
